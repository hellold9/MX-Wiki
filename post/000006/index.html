  document.addEventListener('DOMContentLoaded', function() {
    // Mobile menu toggle
    const mobileMenuToggle = document.querySelector('.mobile-menu-toggle');

    const scrollPercentEl = headerBackToTop ? headerBackToTop.querySelector('.scroll-percent') : null;
    
    if (headerBackToTop) {
      // Click to scroll to top
      headerBackToTop.addEventListener('click', function() {
        window.scrollTo({
          top: 0,
          behavior: 'smooth'
        });
      });
      
      // Update scroll percentage
      function updateScrollPercent() {
        const scrollTop = window.pageYOffset || document.documentElement.scrollTop;
        const docHeight = document.documentElement.scrollHeight - document.documentElement.clientHeight;
        
        if (docHeight <= 0) {
          headerBackToTop.classList.remove('visible');
          return;
        }
        
        const percent = Math.min(100, Math.max(0, Math.round((scrollTop / docHeight) * 100)));
        
        if (scrollPercentEl) {
          scrollPercentEl.textContent = percent;
        }
        
        if (scrollTop <= 10) {
          headerBackToTop.classList.remove('visible');
        } else {
          headerBackToTop.classList.add('visible');
        }
      }
      
      // Initial check
      updateScrollPercent();
      
      // Update on scroll
      window.addEventListener('scroll', updateScrollPercent, { passive: true });
    }
    
    // Random post - 随机逛逛（桌面端和移动端）
    function goToRandomPost() {
      if (window.allPosts && window.allPosts.length > 0) {
        const availablePosts = window.allPosts.filter(function(post) {
          return post && post.link;
        });
        if (availablePosts.length > 0) {
          const randomIndex = Math.floor(Math.random() * availablePosts.length);
          const randomPost = availablePosts[randomIndex];
          if (randomPost && randomPost.link) {
            window.location.href = randomPost.link;
          }
        }
      }
    }
    
    const randomPostBtn = document.querySelector('.random-post');
    if (randomPostBtn) {
      randomPostBtn.addEventListener('click', goToRandomPost);

    });
    
    // 点击背景关闭搜索弹窗

    <script>
      // 计算文章字数和阅读时间
      document.addEventListener('DOMContentLoaded', function() {
        const contentText = document.getElementById('post-content-text');
        if (contentText) {
          // 获取纯文本内容
          const text = contentText.innerText || contentText.textContent || '';
          // 计算中文字符数（包括标点）
          const cnChars = text.match(/[\u4e00-\u9fa5]/g) || [];
          // 计算英文单词数
          const enWords = text.match(/[a-zA-Z]+/g) || [];
          // 总字数 = 中文字符 + 英文单词
          const wordCount = cnChars.length + enWords.length;
          
          // 阅读时间（按每分钟300字计算）
          const readTime = Math.max(1, Math.ceil(wordCount / 300));
          
          // 更新显示
          const wordCountEl = document.getElementById('word-count');
          const readTimeEl = document.getElementById('read-time');
          
          if (wordCountEl) wordCountEl.textContent = wordCount;
          if (readTimeEl) readTimeEl.textContent = readTime;
        }
        
        // 从封面图提取主色调
        const postHeader = document.getElementById('post-header');
        const featureImage = 'https://mx.315996.xyz/post-images/000006.webp';
        
        if (featureImage && postHeader) {
          const img = new Image();
          img.crossOrigin = 'anonymous';
          img.onload = function() {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = 1;
            canvas.height = 1;
            ctx.drawImage(img, 0, 0, img.width, img.height, 0, 0, 1, 1);
            
            try {
              const pixel = ctx.getImageData(0, 0, 1, 1).data;
              const r = pixel[0];
              const g = pixel[1];
              const b = pixel[2];
              
              // 调整亮度，使颜色更鲜艳
              const factor = 1.2;
              const adjustedR = Math.min(255, Math.round(r * factor));
              const adjustedG = Math.min(255, Math.round(g * factor));
              const adjustedB = Math.min(255, Math.round(b * factor));
              
              postHeader.style.backgroundColor = `rgb(${adjustedR}, ${adjustedG}, ${adjustedB})`;
            } catch (e) {
              // 如果提取失败，使用默认主题色
              postHeader.style.backgroundColor = '#105080';
            }
          };
          img.onerror = function() {
            // 图片加载失败时使用默认主题色
            postHeader.style.backgroundColor = '#105080';
          };
          img.src = featureImage;
        }
      });
    </script>
